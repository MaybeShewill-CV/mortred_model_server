# Local observation stack for Mortred Model Server.
# Not a production monitoring deployment: ports bind loopback only.
#
# Mortred's own docker-compose.yml does not run Prometheus. This file only
# observes a Mortred process that is already up (host or another compose
# project). It does not mint scrape tokens.
#
#   mortredctl init-trust
#   set -a && . conf/local/trust.env && set +a
#   export GRAFANA_ADMIN_PASSWORD="$(openssl rand -hex 16)"
#   ./scripts/write_prometheus_credentials.sh   # chowns uid 65534 (Docker nobody)
#   docker compose -f deploy/docker-compose.monitoring.yml up -d
#   Grafana:    http://localhost:3000
#   Prometheus: http://localhost:9090
#
# Scrapes host.docker.internal:8080 (see prometheus.compose.yml). extra_hosts
# maps that name to the host gateway on Linux. Do not use localhost:8080
# here — that would scrape the Prometheus container itself.

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mortred-prometheus
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ${MORTRED_METRICS_TOKEN_FILE:-../conf/local/mortred_metrics_token}:/etc/prometheus/mortred_metrics_token:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mortred-grafana
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/mortred.json:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/mortred.json
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:

# Mortred Model Server - Prometheus scrape configuration
#
# Default job: gateway GET /metrics (public on loopback unless
# MORTRED_METRICS_TOKEN is set). A non-loopback gateway refuses to start
# without that scrape token.
#
# Supervisor GET /api/v1/metrics requires Authorization: Bearer
# <MORTRED_API_TOKEN>. Model /metrics is loopback-only and, when the
# supervisor injected MORTRED_AUTH_TOKEN, requires that same Bearer.
# Scrape model targets only when Prometheus shares the model's network
# namespace. Do not publish model ports to make them scrapeable.
# If the gateway has MORTRED_METRICS_TOKEN, uncomment authorization
# below. credentials_file must contain the raw scrape token (no
# "Bearer " prefix). Do not put the inference token in that file.
#
# Install (bare metal):
#   sudo cp deploy/prometheus.yml /etc/prometheus/prometheus.yml
#   sudo cp deploy/alert-rules.yml /etc/prometheus/alert-rules.yml
#   sudo systemctl restart prometheus
#
# Docker Compose monitoring stack: replace localhost with
# host.docker.internal in the gateway target (see extra_hosts in
# deploy/docker-compose.monitoring.yml).
#
# Standalone:
#   prometheus --config.file=deploy/prometheus.yml --storage.tsdb.path=/tmp/prom-data

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: mortred-gateway
    static_configs:
      - targets: ['localhost:8080']
        labels: { component: gateway }
    # authorization:
    #   type: Bearer

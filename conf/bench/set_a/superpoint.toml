# Bench overlay: TensorRT static_bs1 engine. Not a product config.
# id=superpoint catalog=SUPERPOINT

[SUPERPOINT]
[SUPERPOINT.backend]
type = "tensorrt"
model_file_path = "../weights/feature_point/superpoint/superpoint_120x160.engine.static_bs1.fp16"
device = "gpu"
threads = 4
input_layout = "nchw"
precision_mode = 0
power_mode = 0

[SUPERPOINT.params]
model_score_threshold = 0.015
model_nms_threshold = 4.0
max_track_length = 5
nn_dis_thresh = 0.02
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"

# Bench overlay: TensorRT static_bs1 engine. Not a product config.
# id=enlightengan catalog=ENLIGHTEN_GAN

[ENLIGHTENGAN]
[ENLIGHTENGAN.backend]
type = "tensorrt"
model_file_path = "../weights/enhancement/enlighten_gan/enlightengan.engine.static_bs1.fp16"

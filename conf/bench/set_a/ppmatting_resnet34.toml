# Bench overlay: TensorRT static_bs1 engine. Not a product config.
# id=ppmatting_resnet34 catalog=PP_MATTING

[PP_MATTING]
[PP_MATTING.backend]
type = "tensorrt"
model_file_path = "../weights/matting/ppmatting/pp_humanmatting-resnet34_vd.engine.static_bs1.fp16"
device = "gpu"
threads = 4
input_layout = "nchw"
precision_mode = 0
power_mode = 0

[PP_MATTING.params]
# Keep the same input policy as MODNet for full-size portrait photographs.
max_image_pixels = 25165824
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"

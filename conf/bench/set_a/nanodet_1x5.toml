# Bench overlay: TensorRT static_bs1 engine. Not a product config.
# id=nanodet_1x5 catalog=NANODET


[NanoDet]

[NanoDet.backend]
type = "tensorrt"
model_file_path = "../weights/object_detection/nanodet/nanodet_plus_m_1x5.engine.static_bs1.fp16"
device = "gpu"
threads = 4
input_layout = "nchw"
precision_mode = 0
power_mode = 0

[NanoDet.params]
model_input_image_size = [416, 416]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"
model_class_nums = 80
model_score_threshold = 0.6
model_nms_threshold = 0.35
model_keep_top_k = 250
class_names = [
    "person",

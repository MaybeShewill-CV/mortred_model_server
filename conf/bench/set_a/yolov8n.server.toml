
[YOLOV8_DETECTION_SERVER]
model="YOLOV8"
# port
port=9056
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=1000
max_queue_depth=32
max_batch_size=1
max_batch_delay_ms=5
# server url
server_uri="/mortred_ai_server_v1/obj_detection/yolov8"
server_exe="mortred-model-server.out"

[YOLOV8]
model_config_file_path = "../conf/bench/set_a/yolov8n.toml"


[DBNET_SERVER]
model="DBNET"
# port
port=9060
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=1000
max_queue_depth=32
max_batch_size=1
# server url
server_uri="/mortred_ai_server_v1/ocr/dbtext"
server_exe="mortred-model-server.out"

[DBNET]
model_config_file_path = "../conf/bench/set_a/dbnet.toml"

# Bench server overlay: model_config_file_path is the set-A overlay.
# Not a product config. id=depth_vits14 catalog=DEPTH_ANYTHING

[DEPTH_ANYTHING_ESTIMATION_SERVER]
model="DEPTH_ANYTHING"
# port
port=9040
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access. There is NO anonymous mode: an empty
# token rejects every request, so the supervisor injects MORTRED_AUTH_TOKEN at spawn
# (calibrate injects a per-run token the same way); non-loopback hosts require it
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=5000
# max queued requests before the server answers 429 (overload protection)
max_queue_depth=32
# server url
server_uri="/mortred_ai_server_v1/mono_depth_estimation/depth_anything"
# explicit server executable used by the web console catalog
server_exe="mortred-model-server.out"

[DEPTH_ANYTHING]
model_config_file_path = "../conf/bench/set_a/depth_vits14.toml"

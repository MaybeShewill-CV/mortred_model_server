
[PP_MATTING_SERVER]
model="PP_MATTING"
# port
port=9031
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=5000
max_queue_depth=32
max_batch_size=1
# server url
server_uri="/mortred_ai_server_v1/matting/pp_matting"
server_exe="mortred-model-server.out"

[PP_MATTING]
model_config_file_path = "../conf/bench/set_a/ppmatting_v2.toml"

# Bench overlay: TensorRT static_bs1 engine. Not a product config.
# id=densenet catalog=DENSENET

[DENSENET]
[DENSENET.backend]
type = "tensorrt"
model_file_path = "../weights/classification/densenet/densenet.engine.static_bs1.fp32"
device = "gpu"
threads = 4
input_layout = "nhwc"
precision_mode = 0
power_mode = 0

[DENSENET.params]
model_input_image_size = [224, 224]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"
class_name_file = "../conf/model/classification/imagenet_classes.txt"
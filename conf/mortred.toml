
[supervisor]
# management REST API + embedded UI
api_host = "127.0.0.1"
api_port = 8787
autostart_default = false
start_concurrency = 1
gpu_sample_interval_ms = 500
log_dir = "logs"
log_rotate_mb = 10

[gateway]
host = "127.0.0.1"
port = 8080
request_size_limit_mb = 64
max_connections = 1000
upstream_send_timeout_ms = 180000
upstream_recv_timeout_ms = 180000

# Authorized per-source GCRA (L2). Charged only after auth succeeds (ST2):
# a 401 does not debit this bucket. Optional pre-auth abuse shedding is a
# separate [gateway.abuse_limit] table (off when omitted) and does not share
# this budget. MORTRED_RATE_LIMIT=off|shadow|enforce overrides this table only.
[gateway.rate_limit]
enabled = true
shadow = false
rate_per_sec = 100000
burst = 200000
trusted_proxies = "127.0.0.1,::1"



[DDPM_SAMPLER]
beta_schedule = "linear"
timesteps = 1000
beta_start = 0.0001
beta_end = 0.02
sample_size = [128, 128]
channels = 3
use_fixed_noise_for_psample = true

[DDPM_UNET]
[DDPM_UNET.backend]
type = "onnx"
model_file_path = "../weights/diffusion/ddpm/ddpm_unet_celeba-hq-128x128.static_bs1.onnx"
device = "cpu"
threads = 4

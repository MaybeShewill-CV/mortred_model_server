# CI-only overlay: fork-hosted ONNX Runtime CPU proof for this product id.
# Product serving stays the original conf/model/**/*.toml (mnn/tensorrt).
# Do not point conf/server at this file.

[PP_HUMANSEG]

[PP_HUMANSEG.backend]
type = "onnx"
model_file_path = "../weights/scene_segmentation/pphuman_seg/pp_humanseg_192x192_mobile.static_bs1.onnx"
device = "cpu"
threads = 4
input_layout = "nchw"
input_names = ["x"]
output_names = ["softmax_0.tmp_0"]
precision_mode = 0
power_mode = 0

[PP_HUMANSEG.params]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"

# CI-only overlay: fork-hosted ONNX Runtime CPU proof for this product id.
# Product serving stays the original conf/model/**/*.toml (mnn/tensorrt).
# Do not point conf/server at this file.

[ENLIGHTENGAN]
[ENLIGHTENGAN.backend]
type = "onnx"
model_file_path = "../weights/enhancement/enlighten_gan/enlightengan.static_bs1.onnx"
device = "cpu"
threads = 4
output_names = ["output"]
input_layout = "nchw"
precision_mode = 0
power_mode = 0

[ENLIGHTENGAN.params]
image_decode_backend = "auto"

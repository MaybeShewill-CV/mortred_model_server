# Hosted cpu-profile golden config for bisenetv2 (MNN-CPU). See
# conf/ci/mobilenetv2_hosted.toml for why this family runs MNN on hosted CI.
[BISENETV2]

[BISENETV2.backend]
type = "mnn"
model_file_path = "../weights/scene_segmentation/bisenetv2/bisenetv2_cityscapes.mnn"
device = "cpu"
threads = 4
input_layout = "nhwc"
input_names = ["input_tensor"]
output_names = ["final_output"]
precision_mode = 0
power_mode = 0

[BISENETV2.params]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"

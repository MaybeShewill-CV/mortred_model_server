# CI-only overlay: fork-hosted ONNX Runtime CPU proof for this product id.
# Product serving stays the original conf/model/**/*.toml (mnn/tensorrt).
# Do not point conf/server at this file.

[ATTENTIVEGANDERAIN]
[ATTENTIVEGANDERAIN.backend]
type = "onnx"
model_file_path = "../weights/enhancement/attentive_gan_derain/attentive_gan_derain.static_bs1.onnx"
device = "cpu"
threads = 4
input_layout = "nhwc"
precision_mode = 0
power_mode = 0

[ATTENTIVEGANDERAIN.params]
model_input_image_size = [240, 320]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"

# CI-only overlay: fork-hosted ONNX Runtime CPU proof for this product id.
# Product serving stays the original conf/model/**/*.toml (mnn/tensorrt).
# Do not point conf/server at this file.

[RESNET]
[RESNET.backend]
type = "onnx"
model_file_path = "../weights/classification/resnet/resnet.static_bs1.onnx"
device = "cpu"
threads = 4
input_layout = "nhwc"
precision_mode = 2
power_mode = 0

[RESNET.params]
model_input_image_size = [224, 224]
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
image_decode_backend = "auto"
class_name_file = "../conf/model/classification/imagenet_classes.txt"
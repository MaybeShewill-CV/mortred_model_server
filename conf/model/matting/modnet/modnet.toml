[MODNET_MATTING]

[MODNET_MATTING.backend]
type = "tensorrt"
model_file_path = "../weights/matting/modnet/modnet_hrnet_w18.engine.static_bs1.fp16"
device = "gpu"
threads = 4
input_layout = "nchw"
input_names = ["img"]

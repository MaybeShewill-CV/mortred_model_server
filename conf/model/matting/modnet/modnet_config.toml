[MODNET_MATTING]

[MODNET_MATTING.backend]
type = "mnn"
model_file_path = "../weights/matting/modnet/modnet_hrnet_w18.mnn"
device = "cuda"
threads = 4
input_layout = "nchw"
input_names = ["img"]
output_names = ["sigmoid_2.tmp_0"]
precision_mode = 0
power_mode = 0

[MODNET_MATTING.params]
# Portrait matting commonly receives full-size phone photos; the golden input
# is 3744x5616 (21.0 MP), above the repository-wide 16 MP DoS default.
max_image_pixels = 25165824

[YOLOV8]
[YOLOV8.backend]
type = "tensorrt"
# W5 (perf iteration 5): same static bs1 engine rebuilt with an fp16 input
# binding - halves preprocess write bandwidth and the H2D transfer.
# Fallback for A/B: yolov8s.engine.static_bs1 (fp32 input)
model_file_path = "../weights/object_detection/yolov8/yolov8s.engine.static_bs1.fp16in"
device = "gpu"

[YOLOV8.params]
model_class_nums = 80
model_score_threshold = 0.25
model_nms_threshold = 0.5
model_keep_top_k = 1000
model_input_image_size = [640, 640]
# W4 (perf iteration 4): JPEG DCT-domain reduced decode. "budget" allows one
# reduction notch whose letterbox upsampling stays within the factor below
# (accuracy-gated; see docs/perf/latency_iterations.md). "strict" (default)
# only reduces when the reduced image still covers the network input.
image_decode_mode = "budget"
image_decode_budget_upscale = 1.25
# S1 (perf iteration 6): GPU jpeg decode via nvjpeg (probe-gated hw->sm,
# per-request CPU fallback). "cpu" (default) keeps the OpenCV path.
image_decode_backend = "auto"
class_names = ['person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck', 'boat', 'traffic light', 'fire hydrant', 'stop sign', 'parking meter', 'bench', 'bird', 'cat', 'dog', 'horse', 'sheep', 'cow', 'elephant', 'bear', 'zebra', 'giraffe', 'backpack', 'umbrella', 'handbag', 'tie', 'suitcase', 'frisbee', 'skis', 'snowboard', 'sports ball', 'kite', 'baseball bat', 'baseball glove', 'skateboard', 'surfboard', 'tennis racket', 'bottle', 'wine glass', 'cup', 'fork', 'knife', 'spoon', 'bowl', 'banana', 'apple', 'sandwich', 'orange', 'broccoli', 'carrot', 'hot dog', 'pizza', 'donut', 'cake', 'chair', 'couch', 'potted plant', 'bed', 'dining table', 'toilet', 'tv', 'laptop', 'mouse', 'remote', 'keyboard', 'cell phone', 'microwave', 'oven', 'toaster', 'sink', 'refrigerator', 'book', 'clock', 'vase', 'scissors', 'teddy bear', 'hair drier', 'toothbrush']

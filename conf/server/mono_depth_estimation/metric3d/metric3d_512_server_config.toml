[METRIC3D_ESTIMATION_SERVER]
model="metric3d_512"
# port
port=9041
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=16
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=10000
max_queue_depth=32
max_batch_size=1
# server url
server_uri="/mortred_ai_server_v1/mono_depth_estimation/metric3d_512"
server_exe="mortred-model-server.out"

[metric3d_512]
model_config_file_path="../conf/model/mono_depth_estimation/metric3d/metric3d_512.toml"

[METRIC3D_ESTIMATION_SERVER]
# port
port=9041
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access (empty = disabled; required when host is non-loopback)
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=10000
# server url
server_uri="/mortred_ai_server_v1/mono_depth_estimation/metric3d"
# explicit server executable used by the web console catalog
server_exe="metric3d_estimation_server.out"

[METRIC3D]
model_config_file_path="../conf/model/mono_depth_estimation/metric3d/metric3d_512x1088.toml"

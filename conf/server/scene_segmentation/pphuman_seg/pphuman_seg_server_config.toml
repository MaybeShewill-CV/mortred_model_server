[PPHUMAN_SEG_SERVER]
# port
port=9072
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access (empty = disabled; required when host is non-loopback)
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=3000
# max queued requests before the server answers 429 (overload protection)
max_queue_depth=32
# server url
server_uri="/mortred_ai_server_v1/scene_segmentation/pphuman_seg"
# explicit server executable used by the web console catalog
server_exe="pphuman_segmentation_server.out"

[PPHUMAN_SEG]
model_config_file_path="../conf/model/scene_segmentation/pphuman/pphuman_config.toml"

[DINOV2_FEATURE_EMBEDDING_SERVER]
model="dinov2_vitl14"
port=9112
host="localhost"
max_connections=500
peer_resp_timeout=15
request_size_limit=64
compute_threads=-1
handler_threads=16
worker_nums=1
model_run_timeout=500
max_queue_depth=32
max_batch_size=1
server_uri="/mortred_ai_server_v1/feature_embedding/dinov2_vitl14"
server_exe="mortred-model-server.out"

[dinov2_vitl14]
model_config_file_path="../conf/model/feature_embedding/dinov2/dinov2_vitl14.toml"

[MOBILENETV2_CLASSIFICATION_SERVER]
model="mobilenetv2"
# port
port=9002
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=500
max_queue_depth=32
max_batch_size=1
max_batch_delay_ms=5
# server url
server_uri="/mortred_ai_server_v1/classification/mobilenetv2"
server_exe="mortred-model-server.out"

[mobilenetv2]
model_config_file_path="../conf/model/classification/mobilenetv2/mobilenetv2.toml"

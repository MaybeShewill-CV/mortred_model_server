[MOBILENETV2_CLASSIFICATION_SERVER]
# port
port=9002
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access (empty = disabled; required when host is non-loopback)
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=500
# server url
server_uri="/mortred_ai_server_v1/classification/mobilenetv2"
# explicit server executable used by the web console catalog
server_exe="mobilenetv2_classification_server.out"

[MOBILENETV2]
model_config_file_path="../conf/model/classification/mobilenetv2/mobilenetv2_config.toml"

[YOLOV5_DETECTION_SERVER]
# port
port=9053
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access (empty = disabled; required when host is non-loopback)
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=1000
# server url
server_uri="/mortred_ai_server_v1/obj_detection/yolov5"
# explicit server executable used by the web console catalog
server_exe="yolov5_detection_server.out"

[YOLOV5]
model_config_file_path="../conf/model/object_detection/yolov5/yolov5_config.toml"

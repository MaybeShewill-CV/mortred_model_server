[NANODET_DETECTION_SERVER]
model="nanodet_416"
port=9104
host="localhost"
max_connections=500
peer_resp_timeout=15
request_size_limit=64
compute_threads=-1
handler_threads=16
worker_nums=1
model_run_timeout=1000
max_queue_depth=32
max_batch_size=1
server_uri="/mortred_ai_server_v1/obj_detection/nanodet_416"
server_exe="mortred-model-server.out"

[nanodet_416]
model_config_file_path="../conf/model/object_detection/nano_det/nanodet_416.toml"

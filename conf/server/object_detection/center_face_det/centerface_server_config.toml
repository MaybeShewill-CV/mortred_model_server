[CENTER_FACE_DETECTION_SERVER]
model="centerface"
# port
port=9050
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=1000
max_queue_depth=32
max_batch_size=1
# server url
server_uri="/mortred_ai_server_v1/obj_detection/centerface"
server_exe="mortred-model-server.out"

[centerface]
model_config_file_path="../conf/model/object_detection/centerface/centerface.toml"

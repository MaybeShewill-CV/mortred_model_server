[REAL_ESRGAN_SERVER]
# port
port=9012
# host
host="localhost"
# max connection
max_connections=500
# peer resp timeout seconds
peer_resp_timeout=15
# request size limit(MB)
request_size_limit=64
# bearer token for direct inference access (empty = disabled; required when host is non-loopback)
# auth_token=""
# max requests per second per client ip (0 = unlimited)
# rate_limit_qps=0
# compute threads nums
compute_threads=-1
# handler threads nums
handler_threads=50
# model worker nums
worker_nums=1
# milliseconds
model_run_timeout=10000
# server url
server_uri="/mortred_ai_server_v1/enhancement/real_esrgan"
# explicit server executable used by the web console catalog
server_exe="real_esrgan_server.out"

[REAL_ESRGAN]
model_config_file_path="../conf/model/enhancement/real_esrgan/real_esrgan.toml"

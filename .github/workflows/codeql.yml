name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # Same paths policy as ci.yml: skip pure weights/resources/demo_data changes
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'scripts/**'
      - 'conf/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'vcpkg.json'
      - '.github/**'
      - 'docs/**'
      - 'deploy/**'
  schedule:
    # Every Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two modes:
  #   pr    —— PR/schedule: tests-only (low cost, covers common + test)
  #   full  —— push main / manual: Docker full build + in-container CodeQL tracing (covers apps/model layers)
# Fix: old codeql.yml scanned only the tests-only scope; apps/model layers had no security analysis.
  analyze:
    name: Analyze (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["pr","full"]' || '["pr"]') }}
    steps:
      - uses: actions/checkout@v7

      # ================= PR / schedule: tests-only (same as the main CI tests-only build) =================
      - if: matrix.mode == 'pr'
        name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - if: matrix.mode == 'pr'
        name: Install system dependencies
        run: |
          sudo apt-get update
          # Runner images preinstall libunwind-<ver>-dev (LLVM toolchain), which
          # Breaks libunwind-dev; libgoogle-glog-dev needs libunwind-dev (see
          # ci.yml tests job / Launchpad #1989124/#1991919). Remove it first.
          sudo apt-get remove -y 'libunwind-*-dev' || true
          # apt libgtest-dev ships prebuilt libs + GTestConfig on jammy; the old
          # build-from-/usr/src/googletest flow is unnecessary.
          # build-essential/git: install_deps.sh --workflow compiles workflow.
          sudo apt-get install -y --no-install-recommends build-essential git \
            libopencv-dev libgoogle-glog-dev libeigen3-dev libgtest-dev libssl-dev

      - if: matrix.mode == 'pr'
        name: Install vendored deps (workflow + header-only set; 3rd_party is generated, not tracked)
        run: |
          # Same pair as ci.yml tests: server headers include workflow/WFTask.h
          # even in tests-only configure. --headers does not install workflow.
          ./scripts/install_deps.sh --workflow
          ./scripts/install_deps.sh --headers

      - if: matrix.mode == 'pr'
        name: Configure (tests-only)
        run: cmake -B build-codeql -DMORTRED_BUILD_FULL=OFF

      - if: matrix.mode == 'pr'
        name: Build
        run: cmake --build build-codeql --target check -j"$(nproc)"

      - if: matrix.mode == 'pr'
        name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"

      # ================= full: push main / manual (Docker carrier + in-container CodeQL) =================
      # tests-only can't compile apps/model layers (vendored MNN/TRT/workflow missing).
      # Full mode configures inside the `codeql` image (install_deps.sh in the
      # deps stage) and traces `cmake --build --clean-first` in `docker run`.
      # The init step only downloads the CodeQL bundle to the runner toolcache.
      #
      # Do not build this with the buildx container driver and `load: true`.
      # That driver keeps the image in its own store, then `--load` exports a
      # second tarball into dockerd. On ubuntu-22.04 that export died with
      # "write /src/test/golden/ppmatting_matting.json: no space left on device"
      # while loading the `build` stage (compile products + install tree +
      # golden JSON that --clean-first never reads). The engine's docker
      # driver stores the tagged image once and does not send that tarball.
      - if: matrix.mode == 'full'
        name: Free runner disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h
          # Hosted images preinstall Android, .NET, and other SDKs this job
          # never uses. The CUDA devel carrier plus the traced compile need
          # that space. CodeQL init below re-downloads its own bundle.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/microsoft \
            /usr/local/julia \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
          sudo apt-get clean
          # Swap is a file on some images; drop it so the image unpack can grow.
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          docker system prune -af
          # Golden JSON is not an input to the traced compile or to /out SARIF.
          # .dockerignore already keeps it out of the image; this frees the
          # checkout copy on the runner disk.
          rm -rf "${GITHUB_WORKSPACE}/test/golden"
          echo "Disk after cleanup:"
          df -h

      - if: matrix.mode == 'full'
        name: Download CodeQL CLI (via init)
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - if: matrix.mode == 'full'
        name: Build CodeQL carrier image
        run: |
          set -euo pipefail
          docker buildx ls
          # The preinstalled `default` builder is dockerd BuildKit (driver
          # docker). With no --load, that driver exports type=image straight
          # into the image store. --load on the container driver is the
          # tarball path that filled the disk.
          if docker buildx inspect default --format '{{.Driver}}' 2>/dev/null | grep -qx docker; then
            docker buildx use default
            builder=default
          else
            docker buildx create --name codeql-docker --driver docker --use
            builder=codeql-docker
          fi
          driver="$(docker buildx inspect "$builder" --format '{{.Driver}}')"
          echo "buildx builder=${builder} driver=${driver}"
          test "$driver" = "docker"
          docker buildx build \
            --builder "$builder" \
            --target codeql \
            --tag mortred-full:ci \
            --progress=plain \
            .
          docker image ls mortred-full:ci
          # Drop the untagged deps-stage cache (its own source + 3rd_party
          # layers) before the traced compile writes object files.
          docker builder prune -af
          docker image inspect mortred-full:ci >/dev/null
          # Configured tree, vendored libs, no golden payloads, and a clean
          # target so `cmake --build --clean-first` can run in the next step.
          docker run --rm mortred-full:ci \
            bash -c 'test -f /src/build/CMakeCache.txt && test -d /src/3rd_party/libs && test ! -e /src/test/golden && cmake --build /src/build --target clean'
          echo "Disk after image build:"
          df -h

      # Locate the codeql bundle root in toolcache (contains the codeql/ CLI and ql/ query packs)
      - if: matrix.mode == 'full'
        name: Locate CodeQL bundle in toolcache
        id: codeql-home
        run: |
          set -euo pipefail
          CODEQL_BIN="$(find "$RUNNER_TOOL_CACHE" -type f -path '*/codeql/codeql' | head -n1)"
          test -n "$CODEQL_BIN" || { echo "codeql CLI not found in toolcache" >&2; exit 1; }
          CODEQL_HOME="$(dirname "$(dirname "$CODEQL_BIN")")"
          echo "home=$CODEQL_HOME" >> "$GITHUB_OUTPUT"

      - if: matrix.mode == 'full'
        name: Create and analyze CodeQL database (full compile tracing, in container)
        run: |
          set -euo pipefail
          # One docker run: create and analyze MUST share the same container.
          # codeql database create writes /src/codeql-db into the container's
          # writable layer, which a second `docker run` would not see (the old
          # two-step flow failed analyze with "Database root /src/codeql-db does
          # not exist"). SARIF goes out via the /out mount.
          # Note: don't mount the workspace at /src — that would shadow /src/build and /src/3rd_party
          # built during the image's docker build stage (both gitignored, absent from the workspace),
          # leaving cmake --build /src/build with nothing to build.
          docker run --rm \
            -v "${{ steps.codeql-home.outputs.home }}":/opt/codeql:ro \
            -v "${{ github.workspace }}":/out \
            -w /src \
            mortred-full:ci \
            bash -c 'export PATH=/opt/codeql/codeql:$PATH; rm -rf /src/codeql-db; codeql database create /src/codeql-db --language=cpp --source-root=/src --command="cmake --build /src/build --clean-first -j4" && SUITE="$(find /opt/codeql -type f -name cpp-security-and-quality.qls -path "*/codeql-suites/*" 2>/dev/null | head -n1)" && { test -n "$SUITE" || { echo "error: cpp-security-and-quality.qls not found under /opt/codeql" >&2; exit 1; }; } && echo "analyzing with suite: $SUITE" && codeql database analyze /src/codeql-db --format=sarif-latest --output=/out/codeql-results.sarif "$SUITE"'
          # SARIF contains container-absolute paths /src/src/...; normalize to repo-relative src/... so GitHub can link files.
          # The container writes /out/codeql-results.sarif as root; chown it back to the runner user for rewriting.
          sudo chown "$USER" codeql-results.sarif
          sed -i 's#/src/src/#src/#g' codeql-results.sarif

      - if: matrix.mode == 'full'
        name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results.sarif

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # Same paths policy as ci.yml: skip pure weights/resources/demo_data changes
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'scripts/**'
      - 'conf/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'vcpkg.json'
      - '.github/**'
      - 'docs/**'
      - 'deploy/**'
  schedule:
    # Every Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two modes:
  #   pr    —— PR/schedule: tests-only (low cost, covers common + test)
  #   full  —— push main / manual: Docker full build + in-container CodeQL tracing (covers apps/model layers)
  # Fix: old codeql.yml scanned only the tests-only scope; apps/web_console/model layers had no security analysis.
  analyze:
    name: Analyze (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["pr","full"]' || '["pr"]') }}
    steps:
      - uses: actions/checkout@v7

      # ================= PR / schedule: tests-only (same as the main CI tests-only build) =================
      - if: matrix.mode == 'pr'
        name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - if: matrix.mode == 'pr'
        name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev libgoogle-glog-dev libeigen3-dev
          cd /usr/src/googletest && sudo cmake . && sudo make -j"$(nproc)" && sudo make install

      - if: matrix.mode == 'pr'
        name: Configure (tests-only)
        run: cmake -B build-codeql -DMORTRED_BUILD_FULL=OFF

      - if: matrix.mode == 'pr'
        name: Build
        run: cmake --build build-codeql --target check -j"$(nproc)"

      - if: matrix.mode == 'pr'
        name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"

      # ================= full: push main / manual (Docker full build + full in-container CodeQL flow) =================
      # Note: tests-only can't compile apps/model layers (vendored MNN/TRT/workflow missing), so full mode does
      # real compile tracing inside the Docker build image (install_deps.sh automated deps) and produces SARIF.
      # The init step only downloads the codeql bundle to the runner toolcache (not part of this mode's analysis).
      # Note: first push to main needs manual confirmation (the in-container codeql flow can't be validated in a local sandbox).
      - if: matrix.mode == 'full'
        name: Download CodeQL CLI (via init)
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: security-and-quality

      - if: matrix.mode == 'full'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: matrix.mode == 'full'
        name: Build full image (deps cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: true
          tags: mortred-full:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Locate the codeql bundle root in toolcache (contains the codeql/ CLI and ql/ query packs)
      - if: matrix.mode == 'full'
        name: Locate CodeQL bundle in toolcache
        id: codeql-home
        run: |
          set -euo pipefail
          CODEQL_BIN="$(find "$RUNNER_TOOL_CACHE" -type f -path '*/codeql/codeql' | head -n1)"
          test -n "$CODEQL_BIN" || { echo "codeql CLI not found in toolcache" >&2; exit 1; }
          CODEQL_HOME="$(dirname "$(dirname "$CODEQL_BIN")")"
          echo "home=$CODEQL_HOME" >> "$GITHUB_OUTPUT"

      - if: matrix.mode == 'full'
        name: Create CodeQL database (full compile tracing, in container)
        run: |
          set -euo pipefail
          # Note: don't mount the workspace at /src — that would shadow /src/build and /src/3rd_party
          # built during the image's docker build stage (both gitignored, absent from the workspace),
          # leaving cmake --build /src/build with nothing to build. DB stays in the container; SARIF goes out via /out mount.
          docker run --rm \
            -v "${{ steps.codeql-home.outputs.home }}":/opt/codeql:ro \
            -v "${{ github.workspace }}":/out \
            -w /src \
            mortred-full:ci \
            bash -c 'export PATH=/opt/codeql/codeql:$PATH; rm -rf /src/codeql-db; codeql database create /src/codeql-db --language=cpp --source-root=/src --command="cmake --build /src/build --clean-first -j4"'

      - if: matrix.mode == 'full'
        name: Analyze (in container) and normalize SARIF paths
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ steps.codeql-home.outputs.home }}":/opt/codeql:ro \
            -v "${{ github.workspace }}":/out \
            -w /src \
            mortred-full:ci \
            bash -c 'export PATH=/opt/codeql/codeql:$PATH; codeql database analyze /src/codeql-db --format=sarif-latest --output=/out/codeql-results.sarif cpp-queries:codeql-suites/cpp-security-and-quality.qls'
          # SARIF contains container-absolute paths /src/src/...; normalize to repo-relative src/... so GitHub can link files.
          # The container writes /out/codeql-results.sarif as root; chown it back to the runner user for rewriting.
          sudo chown "$USER" codeql-results.sarif
          sed -i 's#/src/src/#src/#g' codeql-results.sarif

      - if: matrix.mode == 'full'
        name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results.sarif

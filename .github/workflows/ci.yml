name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Trigger only on build/code/config/CI/docs changes; skip pure weights/resources/demo_data changes
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'scripts/**'
      - 'conf/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'vcpkg.json'
      - '.github/**'
      - 'docs/**'
      - 'deploy/**'
  schedule:
    # Daily 02:00 UTC: nightly full gate (see jobs.nightly)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      # If checked, runs the clang compiler row and clang-tidy job (~30-60 min extra dep build)
      full-matrix:
        description: 'Include clang compiler row, clang-tidy job and docker full-werror job'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI overrides the default _bin/_lib; collect artifacts in the build dir to avoid polluting the repo root
  MORTRED_CI_BIN_DIR: ${{ github.workspace }}/build-ci/bin
  MORTRED_CI_LIB_DIR: ${{ github.workspace }}/build-ci/lib

jobs:
  # ---------------------------------------------------------------------------
  # Job A: test matrix (gcc / clang, tests-only, apt deps + ccache cache)
  # ---------------------------------------------------------------------------
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # Daily PRs run only the gcc row (halves dep builds); the clang row runs only on manual full-matrix.
    # matrix context can't be used in job-level if (only github/needs/vars/inputs are available),
    # so the matrix is generated via fromJSON in strategy.matrix based on the trigger type.
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true' && '["gcc","clang"]' || '["gcc"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools and test deps
        run: |
          sudo apt-get update
          # Runner images preinstall libunwind-<ver>-dev (LLVM toolchain), which
          # Breaks libunwind-dev; libgoogle-glog-dev needs libunwind-dev, so apt
          # reports it as not installable (Launchpad #1989124/#1991919).
          # Remove the conflicting packages first; no-op exit is fine when absent.
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y --no-install-recommends ccache jq autoconf autoconf-archive automake libtool \
            libopencv-dev libgoogle-glog-dev libeigen3-dev libgtest-dev libssl-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      # ccache only: tests-only deps (opencv/glog/eigen3/gtest) come straight
      # from apt - the Linux-only project no longer needs vcpkg for them, which
      # removes the recurring clone/bootstrap/port-build flakiness in CI.
      # gcc and quality-gates share the same key to avoid rebuilding the same dependency set.
      - name: Cache ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'test/**') }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-

      - name: Configure (tests-only, apt deps)
        run: >
          cmake -B build-ci
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_BIN_OUTPUT_DIR="$MORTRED_CI_BIN_DIR"
          -DMORTRED_LIB_OUTPUT_DIR="$MORTRED_CI_LIB_DIR"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # The check target builds all tests then runs ctest; CTEST_OUTPUT_ON_FAILURE=1 gives full failure output.
      # One build + one test run, avoiding duplicate execution.
      - name: Build and run unit tests
        run: |
          LD_LIBRARY_PATH="$MORTRED_CI_LIB_DIR" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-ci --target check -j"$(nproc)"

      - name: Verify git status is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository is not clean after build:"
            git status --porcelain
            exit 1
          fi
          echo "Repository is clean after build."

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-${{ matrix.compiler }}
          path: build-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job B: quality gates (-Wall -Wextra -Werror build + clang-format checking only changed files)
  # ---------------------------------------------------------------------------
  quality-gates:
    name: quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools and test deps
        run: |
          sudo apt-get update
          # see tests job: preinstalled libunwind-<ver>-dev conflicts with the
          # libunwind-dev that libgoogle-glog-dev depends on
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y --no-install-recommends ccache clang-format jq autoconf autoconf-archive automake libtool \
            libopencv-dev libgoogle-glog-dev libeigen3-dev libgtest-dev libssl-dev

      - name: Cache ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'test/**') }}
          restore-keys: |
            ccache-gcc-

      - name: Configure (tests-only, warnings as errors)
        run: >
          cmake -B build-gate
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_ENABLE_WERROR=ON
          -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-gate/bin
          -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-gate/lib
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests with -Wall -Wextra -Werror
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/build-gate/lib" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-gate --target check -j"$(nproc)"

      - name: Verify git status is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository is not clean after build:"
            git status --porcelain
            exit 1
          fi
          echo "Repository is clean after build."

      - name: Check formatting of changed C/C++ files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed="$(git diff --name-only "$base" "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed="$(git diff-tree --no-commit-id --name-only -r "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
            else
              changed="$(git diff --name-only "$base" "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
            fi
          fi
          if [ -z "$changed" ]; then
            echo "No C/C++ files changed; skipping clang-format."
            exit 0
          fi

          # Only check lines added/modified by this change (-U0 hunk headers give the line ranges),
          # so pre-existing format issues don't cause false reports while new non-conformant code is still caught.
          check_file() {
            local file="$1"
            local ranges=""
            local hunk new_line start count end
            while IFS= read -r hunk; do
              # Hunk format: @@ -old[,oldc] +new[,newc] @@ ...; take the start line and count from the + side
              new_line="$(echo "$hunk" | sed -n 's/@@ -[0-9]*\(,[0-9]*\)\? +\([0-9][0-9]*\)\(,[0-9]*\)\? @@.*/\2\3/p')"
              [ -n "$new_line" ] || continue
              start="${new_line%,*}"
              count="${new_line#*,}"
              if [ "$count" = "$new_line" ]; then
                count=1
              fi
              [ "$count" -eq 0 ] && continue
              end=$((start + count - 1))
              if [ -n "$ranges" ]; then
                ranges="${ranges},"
              fi
              ranges="${ranges}${start}:${end}"
            done < <(git diff --unified=0 "$base" "$head" -- "$file" | grep '^@@')
            if [ -z "$ranges" ]; then
              echo "skip (no added lines): $file"
              return 0
            fi
            echo "checking: $file"
            clang-format --dry-run --Werror --lines="$ranges" "$file"
          }

          for file in $changed; do
            check_file "$file"
          done

      - name: Repository consistency checks
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py
          python3 scripts/gen_openapi.py --check
          CHECK_ALLOW_GENERATED=1 ./scripts/check_repo_clean.sh
          python3 -m py_compile scripts/server/test_server.py scripts/server/locust_performance.py
          python3 scripts/server/test_server.py --list

  # ---------------------------------------------------------------------------
  # Job B2: sanitizers - permanent regression gate for the async job ledger.
  # TSAN runs the sanitizer-labeled async tests (data-race gate); ASan+UBSan
  # runs the full tests-only suite (memory gate). TSAN scope is deliberately
  # limited to the async tests: unrelated modules may still carry historical
  # races, and widening the label is a separate follow-up.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (tsan + asan/ubsan)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools and test deps
        run: |
          sudo apt-get update
          # see tests job: preinstalled libunwind-<ver>-dev conflicts with the
          # libunwind-dev that libgoogle-glog-dev depends on
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y --no-install-recommends ccache jq autoconf autoconf-archive automake libtool \
            libopencv-dev libgoogle-glog-dev libeigen3-dev libgtest-dev libssl-dev

      - name: Cache ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-gcc-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'test/**') }}
          restore-keys: |
            ccache-gcc-

      - name: Configure and run TSAN gate (async tests)
        run: |
          cmake -B build-tsan \
            -DMORTRED_BUILD_FULL=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-tsan/bin \
            -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-tsan/lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          LD_LIBRARY_PATH="${{ github.workspace }}/build-tsan/lib" \
            cmake --build build-tsan --target async_job_unittest async_job_stress_test -j"$(nproc)"
          # detect_deadlocks / report_mutex_bugs are disabled: this GCC's TSAN
          # cannot model condition_variable::wait_for (false "double lock" and
          # lock-order-inversion on legally CV-guarded mutexes). Data-race
          # detection - the actual gate - stays fully enabled.
          LD_LIBRARY_PATH="${{ github.workspace }}/build-tsan/lib" \
            TSAN_OPTIONS="detect_deadlocks=0:report_mutex_bugs=0" \
            ctest --test-dir build-tsan -L sanitizer --output-on-failure

      - name: Configure and run ASan/UBSan gate (full tests-only suite)
        run: |
          cmake -B build-asan \
            -DMORTRED_BUILD_FULL=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-asan/bin \
            -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-asan/lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          LD_LIBRARY_PATH="${{ github.workspace }}/build-asan/lib" CTEST_OUTPUT_ON_FAILURE=1 \
            cmake --build build-asan --target check -j"$(nproc)"

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-logs
          path: |
            build-tsan/Testing/Temporary/LastTest.log
            build-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job B3: cpu-profile build gate - the ONLY continuous compile coverage for
  # the cpu deployment profile (TRT compiled out). Runs on a GPU-less runner:
  # install_deps.sh --cpu builds MNN-CPU/ORT-CPU/workflow into 3rd_party
  # (cached), then a full MORTRED_BUILD_PROFILE=cpu build + test run.
  # Without this job the conditional-compilation path silently rots.
  # ---------------------------------------------------------------------------
  cpu-profile:
    name: cpu profile (full build, no GPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          # see tests job: preinstalled libunwind-<ver>-dev conflicts with the
          # libunwind-dev that libgoogle-glog-dev depends on
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl jq \
            libssl-dev libgoogle-glog-dev libeigen3-dev libopencv-dev libgtest-dev

      - name: Cache cpu-profile 3rd_party
        id: cache-3rdparty
        uses: actions/cache@v6
        with:
          path: |
            3rd_party
            .deps-build
          key: cpu-profile-3rdparty-${{ hashFiles('scripts/install_deps.sh') }}
          restore-keys: |
            cpu-profile-3rdparty-

      - name: Build cpu dependency set (MNN-CPU / ORT-CPU / workflow)
        if: steps.cache-3rdparty.outputs.cache-hit != 'true'
        run: |
          ./scripts/install_deps.sh --cpu --all
          ./scripts/install_deps.sh --cpu --check

      - name: Verify cpu dependency set (cache hit path)
        if: steps.cache-3rdparty.outputs.cache-hit == 'true'
        run: ./scripts/install_deps.sh --cpu --check

      - name: Configure (full build, cpu profile)
        run: >
          cmake -B build-cpu
          -DMORTRED_BUILD_FULL=ON
          -DMORTRED_BUILD_PROFILE=cpu
          -DMORTRED_INSTALL=ON
          -DCMAKE_BUILD_TYPE=Release
          -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-cpu/bin
          -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-cpu/lib

      - name: Build and run tests (cpu profile)
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/build-cpu/lib" CTEST_OUTPUT_ON_FAILURE=1 \
            cmake --build build-cpu --target check -j"$(nproc)"

      - name: Deployment acceptance (cpu, static)
        run: ./scripts/verify_deployment.sh --basic

      - name: Upload cpu-profile ctest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpu-profile-ctest-log
          path: build-cpu/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  # ---------------------------------------------------------------------------
  # Job C: clang-tidy (informational, non-blocking; produces a report artifact)
  # Runs only on manual full-matrix to avoid a clang dependency build on every PR
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (informational)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: tests
    continue-on-error: true
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools and test deps
        run: |
          sudo apt-get update
          # see tests job: preinstalled libunwind-<ver>-dev conflicts with the
          # libunwind-dev that libgoogle-glog-dev depends on
          sudo apt-get remove -y 'libunwind-*-dev' || true
          sudo apt-get install -y --no-install-recommends clang clang-tidy clang-tools jq autoconf autoconf-archive automake libtool \
            libopencv-dev libgoogle-glog-dev libeigen3-dev libgtest-dev libssl-dev

      - name: Cache ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-clang-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'test/**') }}
          restore-keys: |
            ccache-clang-

      - name: Configure (tests-only, export compile commands)
        run: >
          cmake -B build-tidy
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-tidy/bin
          -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-tidy/lib
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build all test targets
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/build-tidy/lib" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-tidy --target check -j"$(nproc)"

      - name: Run clang-tidy (bugprone + performance)
        run: |
          if command -v run-clang-tidy-14 >/dev/null 2>&1; then
            tidy_cmd="run-clang-tidy-14"
          elif command -v run-clang-tidy >/dev/null 2>&1; then
            tidy_cmd="run-clang-tidy"
          else
            # Fail explicitly when the tool is missing (non-blocking under continue-on-error, but shows red)
            echo "run-clang-tidy not found (install the clang-tools package)" >&2
            exit 1
          fi
          $tidy_cmd -p build-tidy -checks='-*,bugprone-*,performance-*' \
            "${{ github.workspace }}/src/common" "${{ github.workspace }}/src/server" "${{ github.workspace }}/test" \
            > clang-tidy-report.txt 2>&1 || true
          cat clang-tidy-report.txt

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job D: deploy toolchain gate (no build deps needed)
  # Validates deploy script syntax, manifest JSON/YAML validity, and static self-checks (--list / --dry-run),
  # ensuring the install/weight-download/engine-conversion toolchain doesn't break from changes.
  # ---------------------------------------------------------------------------
  deploy-tools:
    name: deploy tools
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip
          pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      - name: Validate deployment scripts (bash -n / py_compile)
        run: |
          set -euo pipefail
          for f in scripts/install_deps.sh scripts/convert_trt_engines.sh \
                   scripts/docker_entrypoint.sh scripts/check_repo_clean.sh \
                   scripts/clean_artifacts.sh scripts/setup_full_deps.sh; do
            bash -n "$f"
          done
          python3 -m py_compile \
            scripts/fetch_weights.py scripts/gen_weights_manifest.py \
            scripts/check_consistency.py scripts/gen_openapi.py scripts/repo_toml.py

      - name: Validate manifests (JSON / YAML)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for f in ['conf/trt_engines.json',
                    'conf/trt_profiles/lightglue_extractor.json',
                    'conf/trt_profiles/lightglue_matcher.json',
                    'conf/weights_manifest.json']:
              json.load(open(f, encoding='utf-8-sig'))
              print(f'[ok] {f}')
          import yaml
          yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))
          print('[ok] docker-compose.yml')
          PY

      - name: Static self-checks (engine list / weights dry-run)

        run: |
          set -euo pipefail
          bash scripts/convert_trt_engines.sh --list
          python3 scripts/fetch_weights.py --dry-run
          python3 scripts/check_consistency.py

      # trtexec contract test: a mock trtexec validates convert_trt_engines.sh's flag composition,
      # success/failure exit codes, and artifact validation semantics in a GPU-less env (external trtexec drives conversion)
      - name: convert_trt_engines.sh contract tests (mock trtexec)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cat > "$TMP/trtexec" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *--help* ]]; then echo "TensorRT version: 8.6.1.6"; exit 0; fi
          [ "${FAKE_FAIL:-0}" = "1" ] && exit 3
          [ "${FAKE_NO_OUTPUT:-0}" = "1" ] && exit 0
          for a in "$@"; do case "$a" in --saveEngine=*) echo engine > "${a#--saveEngine=}";; esac; done
          exit 0
          EOF
          chmod +x "$TMP/trtexec"
          # Placeholder onnx files (match the two real entries in conf/trt_engines.json; weights/ is a gitignored temp area)
          mkdir -p weights/diffusion/ddpm weights/feature_point/lightglue
          touch weights/diffusion/ddpm/ddpm_unet_celeba-hq-128x128.onnx
          touch weights/feature_point/lightglue/extractor.onnx
          # 1) --list needs no trtexec
          bash scripts/convert_trt_engines.sh --list | grep -q "total: 19"
          # 2) --dry-run flag composition: fp16 + TRT8 workspace bytes + buildOnly
          out="$(TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force --dry-run)"
          echo "$out" | grep -q -- "--fp16"
          echo "$out" | grep -q -- "--workspace=6442450944"
          echo "$out" | grep -q -- "--buildOnly"
          # 3) profile JSON -> --minShapes/--optShapes/--maxShapes translation
          #    --only filters by engine path (see convert_trt_engines.sh); extractor hits extractor.engine without hitting matcher
          out2="$(TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only extractor --force --dry-run)"
          echo "$out2" | grep -q -- "--minShapes=image:1x3x64x64 --optShapes=image:1x3x256x256 --maxShapes=image:1x3x512x512"
          # 4) Success path: mock writes a non-empty engine -> script exits 0
          TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force
          # 5) Failure path: mock returns non-zero -> script must exit non-zero (failures no longer swallowed)
          rm -f weights/diffusion/ddpm/ddpm_unet_celeba-hq-128x128.engine
          if TRTEXEC="$TMP/trtexec" FAKE_FAIL=1 bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force; then
            echo "expected non-zero exit on converter failure" >&2; exit 1
          fi
          # 6) Artifact validation: mock returns 0 but writes no engine -> script must exit non-zero
          if TRTEXEC="$TMP/trtexec" FAKE_NO_OUTPUT=1 bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force; then
            echo "expected non-zero exit on missing engine artifact" >&2; exit 1
          fi
          rm -rf "$TMP"

      # Statically lint the workflow files: actionlint catches context-scope errors (e.g. runner used in
      # workflow-level env, matrix in job-level if), preventing "Invalid workflow file" recurrences
      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # actionlint takes workflow PATHS or globs, not a bare directory
          # (v1.7 errors "is a directory"); no-arg mode auto-discovers
          # .github/workflows/*.{yml,yaml} from the repo root
          ./actionlint -color

  # ---------------------------------------------------------------------------
  # Job E: full-build -Werror gate (Docker carrier, reuses install_deps.sh for fully automated deps)
  # --------------------------------------------------------------------------
  full-werror:
    name: full build werror (docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # Always runs on push to main; skipped on PRs by default (image dep layers are heavy to build), manual full-matrix can trigger
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only up to the build stage (dependency compile + full -Werror compile is the gate; no runtime layer needed)
      - name: Build full project with warnings as errors
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job F: PR full-compile gate (Docker carrier + gha cache; triggered only by C++/build-related PRs).
# Fixes "zero app-layer compilation on PRs": server / benchmark / control-plane sources
  # get compile-verified at PR time (~20-40 min full build after a dependency-cache hit).
  # ---------------------------------------------------------------------------
  full-build-pr:
    name: full build (PR gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exactly the same carrier as full-werror: dependency layers reused via gha cache, full -Werror compile
      - name: Build full project with warnings as errors
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job G: daily full gate (schedule / manual): runs a full -Werror build + unit tests + e2e
  # contract on main once a day (ctest in the Dockerfile no longer || true; test failures turn red).
  # Weighted golden behavior tests land together with P0-1 (model-layer fixes), not in this job.
  # ---------------------------------------------------------------------------
  nightly:
    name: nightly full build (docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Nightly full build + tests (warnings as errors)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

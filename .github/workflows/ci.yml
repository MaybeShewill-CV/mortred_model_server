name: CI

on:
  push:
    branches: [main]
  pull_request:
    # 仅与构建/代码/配置/CI/文档相关的改动触发；纯 weights/resources/demo_data 改动跳过
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'scripts/**'
      - 'conf/**'
      - 'test/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'vcpkg.json'
      - '.github/**'
      - 'docs/**'
      - 'deploy/**'
  schedule:
    # 每日 02:00 UTC：nightly 全量门禁（见 jobs.nightly）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      # 勾选后才会运行 clang 编译行与 clang-tidy job（依赖构建约多 30-60 分钟）
      full-matrix:
        description: 'Include clang compiler row, clang-tidy job and docker full-werror job'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg 版本单一来源；升级时只需改这里
  VCPKG_TAG: 2026.01.16
  # vcpkg 克隆到 workspace 之外（github.workspace 的上级目录），保证构建后仓库工作区干净。
  # 注意：runner 上下文在 workflow 级 env 不可用（仅 step 级可用），这里只能用 github 上下文
  VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
  # 带 pinned builtin-baseline 的 manifest 副本（不改动仓库内 vcpkg.json）
  VCPKG_MANIFEST_DIR: ${{ github.workspace }}/../vcpkg-manifest
  # 依赖安装目录同样放在 workspace 之外
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/../vcpkg-installed
  VCPKG_TARGET_TRIPLET: x64-linux
  # CI 覆盖默认的 _bin/_lib，把产物收进构建目录，避免污染仓库根目录
  MORTRED_CI_BIN_DIR: ${{ github.workspace }}/build-ci/bin
  MORTRED_CI_LIB_DIR: ${{ github.workspace }}/build-ci/lib

jobs:
  # ---------------------------------------------------------------------------
  # Job A: 测试矩阵（gcc / clang，tests-only，vcpkg 依赖 + ccache 缓存）
  # ---------------------------------------------------------------------------
  tests:
    name: tests (${{ matrix.compiler }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    # 日常 PR 只跑 gcc 行（省一半依赖构建）；clang 行仅在手动触发 full-matrix 时运行。
    # matrix 上下文不能用于 job 级 if（仅 github/needs/vars/inputs 可用），
    # 因此改为在 strategy.matrix 定义里用 fromJSON 按触发方式生成矩阵。
    strategy:
      fail-fast: false
      matrix:
        compiler: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true' && '["gcc","clang"]' || '["gcc"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache jq
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y --no-install-recommends clang
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      # 缓存 vcpkg 仓库、已安装的依赖产物与 ccache；
      # key 包含 vcpkg 版本、编译器与 vcpkg.json 内容，任何变更都会失效。
      # gcc 与 quality-gates 共享同一 key，避免重复构建同一套依赖。
      - name: Cache vcpkg and ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_INSTALLED_DIR }}
            ~/.cache/ccache
          key: vcpkg-${{ env.VCPKG_TAG }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-${{ matrix.compiler }}-

      # vcpkg 不支持浅克隆，因此固定 checkout 发布 tag（完整克隆）。
      - name: Checkout vcpkg (pinned release tag)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_TAG"

      # 在 workspace 之外准备带 pinned builtin-baseline 的 manifest 副本，
      # 仓库内 vcpkg.json 保持不动：CI 构建始终可复现，且不会弄脏工作区。
      # 若希望本地构建也可复现，在有网机器上执行一次
      # `vcpkg x-update-baseline --add-initial-baseline` 并提交结果即可。
      - name: Bootstrap vcpkg and prepare pinned manifest
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          baseline="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          mkdir -p "$VCPKG_MANIFEST_DIR"
          jq --arg baseline "$baseline" '.builtin-baseline = $baseline' vcpkg.json > "$VCPKG_MANIFEST_DIR/vcpkg.json"
          echo "Pinned vcpkg builtin-baseline to: $baseline"

      - name: Configure (vcpkg toolchain, tests-only)
        run: >
          cmake -B build-ci
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_BIN_OUTPUT_DIR=$MORTRED_CI_BIN_DIR
          -DMORTRED_LIB_OUTPUT_DIR=$MORTRED_CI_LIB_DIR
          -DVCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR
          -DVCPKG_INSTALLED_DIR=$VCPKG_INSTALLED_DIR
          -DVCPKG_MANIFEST_MODE=ON
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # check 目标会先构建全部测试再运行 ctest；CTEST_OUTPUT_ON_FAILURE=1 让失败输出完整。
      # 一次构建 + 一次测试，避免重复执行。
      - name: Build and run unit tests
        run: |
          LD_LIBRARY_PATH="$MORTRED_CI_LIB_DIR" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-ci --target check -j"$(nproc)"

      - name: Verify git status is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository is not clean after build:"
            git status --porcelain
            exit 1
          fi
          echo "Repository is clean after build."

      - name: Upload ctest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-log-${{ matrix.compiler }}
          path: build-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job B: 质量门禁（-Wall -Wextra -Werror 构建 + clang-format 只检查改动文件）
  # ---------------------------------------------------------------------------
  quality-gates:
    name: quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache clang-format jq

      - name: Cache vcpkg and ccache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_INSTALLED_DIR }}
            ~/.cache/ccache
          key: vcpkg-${{ env.VCPKG_TAG }}-gcc-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-gcc-

      - name: Checkout vcpkg (pinned release tag)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_TAG"

      - name: Bootstrap vcpkg and prepare pinned manifest
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          baseline="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          mkdir -p "$VCPKG_MANIFEST_DIR"
          jq --arg baseline "$baseline" '.builtin-baseline = $baseline' vcpkg.json > "$VCPKG_MANIFEST_DIR/vcpkg.json"
          echo "Pinned vcpkg builtin-baseline to: $baseline"

      - name: Configure (tests-only, warnings as errors)
        run: >
          cmake -B build-gate
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_ENABLE_WERROR=ON
          -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-gate/bin
          -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-gate/lib
          -DVCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR
          -DVCPKG_INSTALLED_DIR=$VCPKG_INSTALLED_DIR
          -DVCPKG_MANIFEST_MODE=ON
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests with -Wall -Wextra -Werror
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/build-gate/lib" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-gate --target check -j"$(nproc)"

      - name: Verify git status is clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository is not clean after build:"
            git status --porcelain
            exit 1
          fi
          echo "Repository is clean after build."

      - name: Check formatting of changed C/C++ files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            changed="$(git diff --name-only "$base" "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              changed="$(git diff-tree --no-commit-id --name-only -r "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
            else
              changed="$(git diff --name-only "$base" "$head" -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.inl' || true)"
            fi
          fi
          if [ -z "$changed" ]; then
            echo "No C/C++ files changed; skipping clang-format."
            exit 0
          fi

          # 只校验本次改动新增/修改的行（-U0 的 hunk 头即变更行范围），
          # 不因文件存量格式问题误报，同时能拦截新引入的不规范代码。
          check_file() {
            local file="$1"
            local ranges=""
            local hunk new_line start count end
            while IFS= read -r hunk; do
              # hunk 形如: @@ -old[,oldc] +new[,newc] @@ ...；取 + 侧起始行与行数
              new_line="$(echo "$hunk" | sed -n 's/@@ -[0-9]*\(,[0-9]*\)\? +\([0-9][0-9]*\)\(,[0-9]*\)\? @@.*/\2\3/p')"
              [ -n "$new_line" ] || continue
              start="${new_line%,*}"
              count="${new_line#*,}"
              if [ "$count" = "$new_line" ]; then
                count=1
              fi
              [ "$count" -eq 0 ] && continue
              end=$((start + count - 1))
              if [ -n "$ranges" ]; then
                ranges="${ranges},"
              fi
              ranges="${ranges}${start}:${end}"
            done < <(git diff --unified=0 "$base" "$head" -- "$file" | grep '^@@')
            if [ -z "$ranges" ]; then
              echo "skip (no added lines): $file"
              return 0
            fi
            echo "checking: $file"
            clang-format --dry-run --Werror --lines="$ranges" "$file"
          }

          for file in $changed; do
            check_file "$file"
          done

      - name: Repository consistency checks
        run: |
          set -euo pipefail
          python3 scripts/check_consistency.py
          python3 scripts/gen_openapi.py --check
          CHECK_ALLOW_GENERATED=1 ./scripts/check_repo_clean.sh
          python3 -m py_compile scripts/server/test_server.py scripts/server/locust_performance.py
          python3 scripts/server/test_server.py --list

  # ---------------------------------------------------------------------------
  # Job C: clang-tidy（信息性，不阻塞合并；产出报告 artifact）
  # 仅在手动触发 full-matrix 时运行，避免每次 PR 都做一次 clang 依赖构建
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy (informational)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    needs: tests
    continue-on-error: true
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-tidy clang-tools jq

      - name: Cache vcpkg
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_INSTALLED_DIR }}
            ~/.cache/ccache
          key: vcpkg-${{ env.VCPKG_TAG }}-clang-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TAG }}-clang-

      - name: Checkout vcpkg (pinned release tag)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --detach "$VCPKG_TAG"

      - name: Bootstrap vcpkg and prepare pinned manifest
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          baseline="$(git -C "$VCPKG_ROOT" rev-parse HEAD)"
          mkdir -p "$VCPKG_MANIFEST_DIR"
          jq --arg baseline "$baseline" '.builtin-baseline = $baseline' vcpkg.json > "$VCPKG_MANIFEST_DIR/vcpkg.json"
          echo "Pinned vcpkg builtin-baseline to: $baseline"

      - name: Configure (tests-only, export compile commands)
        run: >
          cmake -B build-tidy
          -DMORTRED_BUILD_FULL=OFF
          -DMORTRED_BIN_OUTPUT_DIR=${{ github.workspace }}/build-tidy/bin
          -DMORTRED_LIB_OUTPUT_DIR=${{ github.workspace }}/build-tidy/lib
          -DVCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR
          -DVCPKG_INSTALLED_DIR=$VCPKG_INSTALLED_DIR
          -DVCPKG_MANIFEST_MODE=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

      - name: Build all test targets
        run: |
          LD_LIBRARY_PATH="${{ github.workspace }}/build-tidy/lib" CTEST_OUTPUT_ON_FAILURE=1 cmake --build build-tidy --target check -j"$(nproc)"

      - name: Run clang-tidy (bugprone + performance)
        run: |
          if command -v run-clang-tidy-14 >/dev/null 2>&1; then
            tidy_cmd="run-clang-tidy-14"
          elif command -v run-clang-tidy >/dev/null 2>&1; then
            tidy_cmd="run-clang-tidy"
          else
            # 工具缺失时显式失败（continue-on-error 下不会阻塞合并，但会报红）
            echo "run-clang-tidy not found (install the clang-tools package)" >&2
            exit 1
          fi
          $tidy_cmd -p build-tidy -checks='-*,bugprone-*,performance-*' \
            "${{ github.workspace }}/src/common" "${{ github.workspace }}/src/server" "${{ github.workspace }}/test" \
            > clang-tidy-report.txt 2>&1 || true
          cat clang-tidy-report.txt

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Job D: 部署工具链门禁（无需构建依赖）
  # 校验部署脚本语法、清单 JSON/YAML 合法性与静态自检（--list / --dry-run），
  # 确保安装/权重下载/引擎转换工具链不因改动而失效。
  # ---------------------------------------------------------------------------
  deploy-tools:
    name: deploy tools
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip
          pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml

      - name: Validate deployment scripts (bash -n / py_compile)
        run: |
          set -euo pipefail
          for f in scripts/install_deps.sh scripts/convert_trt_engines.sh \
                   scripts/docker_entrypoint.sh scripts/check_repo_clean.sh \
                   scripts/clean_artifacts.sh scripts/setup_full_deps.sh; do
            bash -n "$f"
          done
          python3 -m py_compile \
            scripts/fetch_weights.py scripts/gen_weights_manifest.py \
            scripts/check_consistency.py scripts/gen_openapi.py scripts/repo_toml.py

      - name: Validate manifests (JSON / YAML)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for f in ['conf/trt_engines.json',
                    'conf/trt_profiles/lightglue_extractor.json',
                    'conf/trt_profiles/lightglue_matcher.json',
                    'conf/weights_manifest.json']:
              json.load(open(f, encoding='utf-8-sig'))
              print(f'[ok] {f}')
          import yaml
          yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))
          print('[ok] docker-compose.yml')
          PY

      - name: Static self-checks (engine list / weights dry-run)

        run: |
          set -euo pipefail
          bash scripts/convert_trt_engines.sh --list
          python3 scripts/fetch_weights.py --dry-run
          python3 scripts/check_consistency.py

      # trtexec 契约测试：用假 trtexec 在无 GPU 环境验证 convert_trt_engines.sh 的
      # flag 组成、成功/失败退出码与产物校验语义（自研转换器移除后由外部 trtexec 驱动）
      - name: convert_trt_engines.sh contract tests (mock trtexec)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cat > "$TMP/trtexec" <<'EOF'
          #!/usr/bin/env bash
          if [[ "$*" == *--help* ]]; then echo "TensorRT version: 8.6.1.6"; exit 0; fi
          [ "${FAKE_FAIL:-0}" = "1" ] && exit 3
          [ "${FAKE_NO_OUTPUT:-0}" = "1" ] && exit 0
          for a in "$@"; do case "$a" in --saveEngine=*) echo engine > "${a#--saveEngine=}";; esac; done
          exit 0
          EOF
          chmod +x "$TMP/trtexec"
          # 占位 onnx（对应 conf/trt_engines.json 中两条真实条目；weights/ 为 gitignored 临时空间）
          mkdir -p weights/diffusion/ddpm weights/feature_point/lightglue
          touch weights/diffusion/ddpm/ddpm_unet_celeba-hq-128x128.onnx
          touch weights/feature_point/lightglue/extractor.onnx
          # 1) --list 无需 trtexec
          bash scripts/convert_trt_engines.sh --list | grep -q "total: 19"
          # 2) --dry-run flag 组成：fp16 + TRT8 workspace 字节 + buildOnly
          out="$(TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force --dry-run)"
          echo "$out" | grep -q -- "--fp16"
          echo "$out" | grep -q -- "--workspace=6442450944"
          echo "$out" | grep -q -- "--buildOnly"
          # 3) profile JSON -> --minShapes/--optShapes/--maxShapes 翻译
          #    --only 按引擎路径过滤（见 convert_trt_engines.sh），extractor 命中 extractor.engine 且不误中 matcher
          out2="$(TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only extractor --force --dry-run)"
          echo "$out2" | grep -q -- "--minShapes=image:1x3x64x64 --optShapes=image:1x3x256x256 --maxShapes=image:1x3x512x512"
          # 4) 成功路径：mock 产出非空 engine -> 脚本退出 0
          TRTEXEC="$TMP/trtexec" bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force
          # 5) 失败路径：mock 返回非 0 -> 脚本必须非 0（失败不再被吞）
          rm -f weights/diffusion/ddpm/ddpm_unet_celeba-hq-128x128.engine
          if TRTEXEC="$TMP/trtexec" FAKE_FAIL=1 bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force; then
            echo "expected non-zero exit on converter failure" >&2; exit 1
          fi
          # 6) 产物校验：mock 返回 0 但不写 engine -> 脚本必须非 0
          if TRTEXEC="$TMP/trtexec" FAKE_NO_OUTPUT=1 bash scripts/convert_trt_engines.sh --only ddpm_unet_celeba-hq-128 --force; then
            echo "expected non-zero exit on missing engine artifact" >&2; exit 1
          fi
          rm -rf "$TMP"

      # 静态 lint workflow 文件：actionlint 能捕获上下文作用域错误（如 runner 用于
      # workflow 级 env、matrix 用于 job 级 if），防止 Invalid workflow file 复发
      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/

  # ---------------------------------------------------------------------------
  # Job E: 全量构建 -Werror 门禁（Docker 载体，复用 install_deps.sh 全自动依赖）
  # --------------------------------------------------------------------------
  full-werror:
    name: full build werror (docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # push 到 main 常跑；PR 默认跳过（镜像依赖层构建较重），手动 full-matrix 可触发
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full-matrix == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建到 build 阶段（依赖编译 + 全量 -Werror 编译即门禁目的，无需 runtime 层）
      - name: Build full project with warnings as errors
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job F: PR 全量编译门禁（Docker 载体 + gha 缓存；仅 C++/构建相关 PR 触发）。
  # 修复"PR 阶段应用层零编译"：22 个 server / 34 个 benchmark / web_console 的代码
  # 在 PR 阶段即可编译验证（依赖层缓存命中后全量编译约 20-40 分钟）。
  # ---------------------------------------------------------------------------
  full-build-pr:
    name: full build (PR gate)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 与 full-werror 完全相同的载体：依赖层经 gha 缓存复用，全量 -Werror 编译
      - name: Build full project with warnings as errors
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job G: 每日全量门禁（schedule / 手动触发）：main 上每天跑一次 full -Werror
  # 构建 + 单测 + e2e 契约（Dockerfile 内 ctest 不再 || true，测试失败即红）。
  # 带权重的 golden 行为测试与 P0-1（模型层修复）一起落地，不在本 job 内。
  # ---------------------------------------------------------------------------
  nightly:
    name: nightly full build (docker)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Nightly full build + tests (warnings as errors)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: false
          build-args: |
            EXTRA_CMAKE_FLAGS=-DMORTRED_ENABLE_WERROR=ON
          cache-from: type=gha
          cache-to: type=gha,mode=max

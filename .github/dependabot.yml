version: 2
updates:
  # Auto-upgrade GitHub Actions versions (pin to commit SHA after upgrading)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Auto-update vcpkg manifest (incl. builtin-baseline).
  # Note: after a baseline bump, check VCPKG_TAG in ci.yml accordingly.
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

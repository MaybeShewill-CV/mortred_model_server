<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/><stop offset="100%" stop-color="#15191f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ad7ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ad7ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8ad7ff" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.4;1.1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1.5" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="72" y="82" fill="#f4f7fb" font-size="30" font-weight="700" letter-spacing="-0.6">Where one request spends its 12.89 ms</text>
    <text x="72" y="116" fill="#98a2b3" font-size="16">yolov8s · static bs1 · fp16 input engine · RTX 2070 SUPER · p50 of a 10672-sample run</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">
    <rect x="72.0" y="176" width="0" height="46" rx="3" fill="#252b34" fill-opacity="0.85"><animate attributeName="width" values="0;112.0" dur="0.9s" fill="freeze"/></rect>
    <rect x="184.0" y="176" width="0" height="46" rx="3" fill="#252b34" fill-opacity="0.85"><animate attributeName="width" values="0;77.6" dur="0.9s" fill="freeze"/></rect>
    <rect x="261.6" y="176" width="0" height="46" rx="3" fill="#8ad7ff" fill-opacity="0.85"><animate attributeName="width" values="0;432.2" dur="0.9s" fill="freeze"/></rect>
    <rect x="693.8" y="176" width="0" height="46" rx="3" fill="#8ad7ff" fill-opacity="0.85"><animate attributeName="width" values="0;77.6" dur="0.9s" fill="freeze"/></rect>
    <rect x="771.4" y="176" width="0" height="46" rx="3" fill="#8ad7ff" fill-opacity="0.85"><animate attributeName="width" values="0;31.8" dur="0.9s" fill="freeze"/></rect>
    <rect x="803.2" y="176" width="0" height="46" rx="3" fill="#ffb877" fill-opacity="0.85"><animate attributeName="width" values="0;268.1" dur="0.9s" fill="freeze"/></rect>
    <rect x="1071.3" y="176" width="0" height="46" rx="3" fill="#8ad7ff" fill-opacity="0.85"><animate attributeName="width" values="0;67.9" dur="0.9s" fill="freeze"/></rect>
    <rect x="1139.2" y="176" width="0" height="46" rx="3" fill="#8ad7ff" fill-opacity="0.85"><animate attributeName="width" values="0;68.8" dur="0.9s" fill="freeze"/></rect>
    <rect x="72" y="176" width="120" height="46" fill="url(#sheen)" opacity="0.10">
      <animate attributeName="x" values="72;1088" dur="7s" repeatCount="indefinite"/></rect>
    <text x="128.0" y="252" fill="#98a2b3" text-anchor="middle">shell</text>
    <line x1="128.0" y1="226" x2="128.0" y2="238" stroke="#252b34"/>
    <text x="222.8" y="272" fill="#98a2b3" text-anchor="middle">framework</text>
    <line x1="222.8" y1="226" x2="222.8" y2="258" stroke="#252b34"/>
    <text x="477.7" y="252" fill="#98a2b3" text-anchor="middle">decode</text>
    <line x1="477.7" y1="226" x2="477.7" y2="238" stroke="#252b34"/>
    <text x="732.6" y="272" fill="#98a2b3" text-anchor="middle">pre</text>
    <line x1="732.6" y1="226" x2="732.6" y2="258" stroke="#252b34"/>
    <text x="787.3" y="252" fill="#98a2b3" text-anchor="middle">h2d</text>
    <line x1="787.3" y1="226" x2="787.3" y2="238" stroke="#252b34"/>
    <text x="937.2" y="272" fill="#98a2b3" text-anchor="middle">exec</text>
    <line x1="937.2" y1="226" x2="937.2" y2="258" stroke="#252b34"/>
    <text x="1105.2" y="252" fill="#98a2b3" text-anchor="middle">d2h</text>
    <line x1="1105.2" y1="226" x2="1105.2" y2="238" stroke="#252b34"/>
    <text x="1173.6" y="272" fill="#98a2b3" text-anchor="middle">post</text>
    <line x1="1173.6" y1="226" x2="1173.6" y2="258" stroke="#252b34"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
    <text x="72" y="300" fill="#f4f7fb">decode + pre + h2d = 6.14 ms (48%)</text>
    <text x="380" y="300" fill="#98a2b3">the GPU sees no pixel until those are done</text>
    <text x="1208" y="300" fill="#8ad7ff" text-anchor="end">12.89 ms</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" role="img" aria-label="HTTP RPS per model">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/><stop offset="100%" stop-color="#121a30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2742"/></pattern>
  </defs>
  <rect width="1120" height="380" fill="url(#bbg)"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.35"/>
  <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="50" y="48" fill="#e8eeff" font-size="22" font-weight="700">real HTTP throughput</text>
    <text x="50" y="74" fill="#8391b8" font-size="14">RTX 2070 SUPER · one model per process · closed loop, 16 concurrent clients · 2026-09</text>

    <line x1="220" y1="96" x2="220" y2="336" stroke="#16213b"/>
    <line x1="375" y1="96" x2="375" y2="336" stroke="#16213b"/>
    <line x1="530" y1="96" x2="530" y2="336" stroke="#16213b"/>
    <line x1="685" y1="96" x2="685" y2="336" stroke="#16213b"/>
    <line x1="840" y1="96" x2="840" y2="336" stroke="#16213b"/>
    <g font-size="14" fill="#c3cbe6">
      <text x="50" y="120">superpoint</text>       <text x="900" y="120" fill="#7ce8fa">1011 rps</text><text x="1000" y="120" fill="#5f6d96">p99 27 ms</text>
      <text x="50" y="160">mobilenetv2</text>      <text x="900" y="160" fill="#7ce8fa">568 rps</text><text x="1000" y="160" fill="#5f6d96">p99 29 ms</text>
      <text x="50" y="200">centerface</text>       <text x="900" y="200" fill="#7ce8fa">462 rps</text><text x="1000" y="200" fill="#5f6d96">p99 54 ms</text>
      <text x="50" y="240">pphuman_mobile</text>   <text x="900" y="240" fill="#7ce8fa">410 rps</text><text x="1000" y="240" fill="#5f6d96">p99 56 ms</text>
      <text x="50" y="280">yolov8s</text>          <text x="900" y="280" fill="#7ce8fa">298 rps</text><text x="1000" y="280" fill="#5f6d96">p99 139 ms</text>
      <text x="50" y="320">realesrgan</text>       <text x="900" y="320" fill="#ffa8d0">6 rps</text>  <text x="1000" y="320" fill="#5f6d96">p99 4356 ms</text>
    </g>

    <g fill="url(#bar)" opacity="0.85">
      <rect x="220" y="106" width="0" height="18" rx="9"><animate attributeName="width" values="0;620" dur="1.1s" fill="freeze"/></rect>
      <rect x="220" y="146" width="0" height="18" rx="9"><animate attributeName="width" values="0;348" dur="1.1s" begin="0.1s" fill="freeze"/></rect>
      <rect x="220" y="186" width="0" height="18" rx="9"><animate attributeName="width" values="0;283" dur="1.1s" begin="0.2s" fill="freeze"/></rect>
      <rect x="220" y="226" width="0" height="18" rx="9"><animate attributeName="width" values="0;251" dur="1.1s" begin="0.3s" fill="freeze"/></rect>
      <rect x="220" y="266" width="0" height="18" rx="9"><animate attributeName="width" values="0;183" dur="1.1s" begin="0.4s" fill="freeze"/></rect>
      <rect x="220" y="306" width="0" height="18" rx="9"><animate attributeName="width" values="0;4" dur="1.1s" begin="0.5s" fill="freeze"/></rect>
    </g>
    <text x="50" y="360" fill="#5f6d96" font-size="12">full 39-model table: docs/benchmark-set-a.md · stage-by-stage latency: docs/perf/latency_iterations.md</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mortred Supervisor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">mortred::mc</div>
    <div id="gateway-status" class="gateway-bar">gw …</div>
    <div id="conn-status" class="conn-unknown">connecting…</div>
    <button id="btn-token" class="btn small" title="设置 Supervisor API 访问令牌">[T]</button>
  </header>

  <!-- ============ VIEW: OVERVIEW ============ -->
  <div id="view-overview" class="view">
    <section id="gpu-panel" class="card gpu-panel">
      <div class="panel-head">
        <span class="panel-title">gpu heartbeat</span>
        <span id="gpu-readout" class="gpu-readout">…</span>
      </div>
      <canvas id="gpu-canvas" class="gpu-canvas"></canvas>
    </section>

    <section class="card fleet-panel">
      <div class="panel-head">
        <span class="panel-title">fleet_<span id="fleet-count">0</span></span>
        <span class="panel-title dim">⌘K</span>
      </div>
      <div id="fleet-grid" class="fleet-grid"></div>
    </section>

    <section class="card river-panel">
      <div class="panel-head">
        <span class="panel-title">activity river</span>
      </div>
      <div id="river-content" class="river-content"></div>
    </section>
  </div>

  <!-- ============ VIEW: MODEL WORKBENCH ============ -->
  <div id="view-workbench" class="view hidden">
    <div class="wb-head">
      <button id="wb-breadcrumb" class="btn small">‹ fleet</button>
      <span id="wb-title" class="wb-title"></span>
    </div>
    <div class="wb-grid">
      <aside class="card wb-identity-card">
        <div class="panel-head"><span class="panel-title">identity</span></div>
        <div id="wb-identity"></div>
        <div class="wb-controls">
          <button id="wb-start" class="btn small">start</button>
          <button id="wb-restart" class="btn small">rst</button>
          <button id="wb-stop" class="btn small danger">stop</button>
        </div>
      </aside>

      <section class="card wb-bench-card">
        <div class="panel-head">
          <span class="panel-title">test bench</span>
        </div>
        <div id="empty-hint" class="empty-hint">// select a model from the fleet</div>
        <div id="image-input-area" class="hidden">
          <div class="input-row">
            <button id="btn-pick-file" class="btn">upload</button>
            <button id="btn-pick-folder" class="btn">folder</button>
            <input id="file-input" type="file" accept="image/*" multiple hidden>
            <input id="folder-input" type="file" webkitdirectory hidden>
            <button id="btn-send" class="btn primary">send</button>
            <button id="btn-cancel" class="btn danger hidden">cancel</button>
          </div>
          <div id="drop-zone">drop here</div>
          <div id="file-list"></div>
          <div id="batch-progress" class="hidden">
            <div class="progress-bar"><div id="batch-progress-fill"></div></div>
            <span id="batch-progress-text"></span>
          </div>
        </div>
        <div id="results">
          <div class="panel-head"><span class="panel-title">results</span></div>
          <div id="results-list"></div>
        </div>
      </section>

      <section id="log-panel" class="wb-log-card">
        <div id="log-toolbar">
          <label>log</label>
          <select id="log-server"></select>
          <label class="inline"><input type="checkbox" id="log-follow" checked> follow</label>
          <button id="btn-log-pause" class="btn small">pause</button>
          <input id="log-filter" type="text" placeholder="filter…">
          <button id="btn-log-clear" class="btn small">clear</button>
          <span id="log-meta"></span>
        </div>
        <pre id="log-content"></pre>
      </section>
    </div>
  </div>

  <!-- ============ COMMAND PALETTE ============ -->
  <div id="palette" class="hidden">
    <div id="palette-backdrop"></div>
    <div id="palette-box">
      <input id="palette-input" type="text" placeholder="start yolov8 / open ddpm / token…" autocomplete="off">
      <div id="palette-list"></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>

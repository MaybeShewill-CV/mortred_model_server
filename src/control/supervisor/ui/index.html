<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mortred Supervisor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">🛰️ Mortred Supervisor</div>
    <div id="gateway-status" class="gateway-bar">gateway: …</div>
    <div id="conn-status" class="conn-unknown">连接中…</div>
    <button id="btn-token" class="btn small" title="设置 Supervisor API 访问令牌">令牌</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="side-title">servers_<span id="server-count">0</span></div>
      <div id="server-list"></div>
    </aside>

    <main id="main">
      <section id="input-panel" class="card">
        <div class="panel-head">
          <span class="panel-title">input</span>
          <span id="selected-server-info"></span>
        </div>
        <div id="empty-hint" class="empty-hint">// select a server</div>
        <div id="image-input-area" class="hidden">
          <div class="input-row">
            <button id="btn-pick-file" class="btn">upload</button>
            <button id="btn-pick-folder" class="btn">folder</button>
            <input id="file-input" type="file" accept="image/*" multiple hidden>
            <input id="folder-input" type="file" webkitdirectory hidden>
            <button id="btn-send" class="btn primary">send</button>
            <button id="btn-cancel" class="btn danger hidden">cancel</button>
          </div>
          <div id="drop-zone">drop here</div>
          <div id="file-list"></div>
          <div id="batch-progress" class="hidden">
            <div class="progress-bar"><div id="batch-progress-fill"></div></div>
            <span id="batch-progress-text"></span>
          </div>
        </div>
      </section>

      <section id="results">
        <div class="panel-head"><span class="panel-title">results</span></div>
        <div id="results-list"></div>
      </section>
    </main>
  </div>

  <section id="log-panel">
    <div id="log-toolbar">
      <label>log</label>
      <span id="log-current-server" class="log-current"></span>
      <select id="log-server"></select>
      <label class="inline"><input type="checkbox" id="log-follow" checked> 跟随</label>
      <button id="btn-log-pause" class="btn small">暂停</button>
      <input id="log-filter" type="text" placeholder="filter…">
      <button id="btn-log-search" class="btn small">搜索</button>
      <button id="btn-log-clear" class="btn small">清空</button>
      <button id="btn-log-copy" class="btn small">复制</button>
      <span id="log-meta"></span>
    </div>
    <pre id="log-content"></pre>
  </section>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mortred Model Server 控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">🛰️ Mortred Model Server 控制台</div>
    <div id="conn-status" class="conn-unknown">连接中…</div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="side-title">可用 Server（<span id="server-count">0</span>）</div>
      <div id="server-list"></div>
    </aside>

    <main id="main">
      <section id="input-panel" class="card">
        <div class="panel-head">
          <span class="panel-title">输入</span>
          <span id="selected-server-info"></span>
        </div>
        <div id="image-input-area" class="hidden">
          <div class="input-row">
            <button id="btn-pick-file" class="btn">选择单张图片</button>
            <button id="btn-pick-folder" class="btn">选择文件夹</button>
            <input id="file-input" type="file" accept="image/*" multiple hidden>
            <input id="folder-input" type="file" webkitdirectory hidden>
            <button id="btn-send" class="btn primary">发送</button>
            <button id="btn-cancel" class="btn danger hidden">取消</button>
          </div>
          <div id="drop-zone">或将图片拖拽到此处</div>
          <div id="file-list"></div>
          <div id="batch-progress" class="hidden">
            <div class="progress-bar"><div id="batch-progress-fill"></div></div>
            <span id="batch-progress-text"></span>
          </div>
        </div>
        <div id="chat-input-area" class="hidden">
          <div class="input-row">
            <textarea id="chat-text" rows="3" placeholder="输入对话内容…（qwen2-vl 可附带一张图片）"></textarea>
          </div>
          <div class="input-row">
            <button id="btn-chat-image" class="btn">附加图片</button>
            <input id="chat-image-input" type="file" accept="image/*" hidden>
            <span id="chat-image-name"></span>
            <button id="btn-chat-send" class="btn primary">发送</button>
          </div>
          <div id="chat-history"></div>
        </div>
      </section>

      <section id="results">
        <div class="panel-head"><span class="panel-title">结果</span></div>
        <div id="results-list"></div>
      </section>
    </main>
  </div>

  <section id="log-panel">
    <div id="log-toolbar">
      <label>Server 日志</label>
      <span id="log-current-server" class="log-current"></span>
      <select id="log-server"></select>
      <label class="inline"><input type="checkbox" id="log-follow" checked> 跟随</label>
      <button id="btn-log-pause" class="btn small">暂停</button>
      <input id="log-filter" type="text" placeholder="过滤关键字…">
      <button id="btn-log-search" class="btn small">搜索</button>
      <button id="btn-log-clear" class="btn small">清空</button>
      <button id="btn-log-copy" class="btn small">复制</button>
      <span id="log-meta"></span>
    </div>
    <pre id="log-content"></pre>
  </section>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>

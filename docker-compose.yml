# Mortred Model Server - 容器编排示例
#
# 使用：
#   docker compose build
#   APP_AUTH_TOKEN=your-token docker compose up -d
#   权重目录挂载：默认 ./weights，可改 WEIGHTS_DIR
#
# 模型端口（9001-9072）按需映射；web console 固定 8787。
services:
  mortred:
    build: .
    image: mortred_model_server:latest
    container_name: mortred
    environment:
      APP_AUTH_TOKEN: "${APP_AUTH_TOKEN:?set APP_AUTH_TOKEN to protect the console}"
      APP_LISTEN_HOST: "0.0.0.0"
      APP_LISTEN_PORT: "8787"
    ports:
      - "8787:8787"
      # 常用模型端口（按需取消注释）
      # - "9002:9002"   # mobilenetv2
      # - "9053:9053"   # yolov5
      # - "9056:9056"   # yolov8
      # - "9060:9060"   # dbnet ocr
    volumes:
      - "${WEIGHTS_DIR:-./weights}:/opt/mortred/weights"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
